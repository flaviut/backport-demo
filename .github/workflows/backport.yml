name: Backport
on:
  pull_request_target:
    types: [closed, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  backport:
    if: github.event.pull_request.merged && startsWith(github.event.label.name, 'backport ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: korthout/backport-action@v4
