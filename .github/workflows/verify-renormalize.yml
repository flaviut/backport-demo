name: Verify LF backport with renormalization
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: verify-lf-renormalization
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enable normalization during cherry-picks
        run: |
          git config --local merge.renormalize true
          cp scripts/verify-lf-backport.py "$RUNNER_TEMP/verify-lf-backport.py"
      - name: Backport using FreeCAD's pinned action
        id: backport
        uses: korthout/backport-action@66065406958f46e82238fd59546f5a99e69e22aa # v4.5.2
        with:
          source_pr_number: '1'
          target_branches: release-1.0-lf-renormalized
          label_pattern: '^DISABLED$'
      - name: Require a successful backport
        env:
          BACKPORT_SUCCESS: ${{ steps.backport.outputs.was_successful }}
        run: test "$BACKPORT_SUCCESS" = true
      - name: Verify committed source content and LF endings
        run: |
          git fetch origin refs/heads/backport-1-to-release-1.0-lf-renormalized:refs/remotes/origin/backport-1-to-release-1.0-lf-renormalized
          python3 "$RUNNER_TEMP/verify-lf-backport.py" origin/backport-1-to-release-1.0-lf-renormalized f96751f9316f99aab61cb27d0c817113c7fc2fcb
